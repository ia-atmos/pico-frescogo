;; The configuration of FrescoGO!: a table of Atmos (read with `X.load`),
;; here with other values, for the test `03-tempo`. Each value
;; is apart from the others: none is computed from another one.

[
    ;; OS TEMPOS
    tempos = [
        jogo     = 60,         ;; tempo total de jogo (360s = 6 minutos)
        queda    = 12,          ;; tempo descontado por queda (12s)
        esquenta = 60,          ;; tempo total de aquecimento (60s)
        descanso = 90,          ;; tempo máximo de descanso (90s)
        saque    = 5,           ;; tempo para sacar antes de o descanso contar (5s)
        aviso    = 30,          ;; aviso sonoro quando falta este tempo (30s)
    ],

    ;; A PONTUAÇÃO
    pontos = [
        golpes     = 150,       ;; golpes mais fortes que contam de cada atleta (150)
        minima     = 50,        ;; velocidade mínima de um golpe pontuável (50km/h)
        equilibrio = 130,       ;; limite da maior pontuação relativa à menor (0=desligado, 130=130%)
        equ_golpes = 30,        ;; golpes dos dois atletas a partir dos quais o equilíbrio vale (30)
    ],

    ;; O RADAR
    radar = [
        serial   = "",          ;; porta serial ("" = maior detectada)
        lado     = 1,           ;; lado em que está posicionado (1=esq, 2=dir)
        saque    = 45,          ;; velocidade mínima de um saque (45km/h)
        reps     = 3,           ;; mínimo de medidas na mesma direção para um golpe (3, até 10)
        igual    = 700,         ;; tempo mínimo entre golpes na mesma direção (700ms)
        oposi    = 300,         ;; tempo mínimo entre golpes em direções opostas (300ms)
        silencio = 3500,        ;; modo automático: queda após este silêncio (3500ms)
        resaque  = 1000,        ;; modo automático: saque após a queda (1000ms)
    ],

    ;; OS NOMES, ao ligar o software
    nomes = [
        esq     = "Atleta 1",   ;; atleta à esquerda
        dir     = "Atleta 2",   ;; atleta à direita
        arbitro = "Árbitro",    ;; árbitro
    ],

    ;; A TELA
    tela = [
        imagem1    = "data/fresco-radar.png",   ;; imagem à esquerda
        imagem2    = "data/fresco-radar.png",   ;; imagem à direita
        recorde    = 0,         ;; recorde ao ligar o software
        velocidade = 1500,      ;; tempo em que a velocidade de um golpe fica na tela (1500ms)
        seta       = 500,       ;; tempo em que a seta de um golpe fica na tela (500ms)
    ],

    ;; OS SONS (arquivos em `data/snds/`)
    som = [
        minima   = 50,          ;; velocidade mínima de um golpe com som (50km/h)
        golpes   = [            ;; o som de um golpe abaixo de cada velocidade (km/h)
            [  60, "peteleco.mp3"   ],
            [  70, "agudo.wav"      ],
            [  80, "laser.wav"      ],
            [  90, "hit.wav"        ],
            [ 100, "trophaser.wav"  ],
            [ 999, "ambulancia.wav" ],
        ],
        saque    = "start.wav",         ;; o saque
        queda    = "fall.wav",          ;; uma queda
        desfaz   = "undo.wav",          ;; uma sequência desfeita
        aviso    = "30s.wav",           ;; o aviso do tempo, e do descanso esgotado
        fim      = "queda2.wav",        ;; o fim da apresentação
        reinicio = "restart.wav",       ;; uma nova apresentação
    ],
]
